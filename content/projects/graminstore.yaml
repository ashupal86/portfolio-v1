title: GraminStore
description: >-
  Quick-commerce web app for rural merchants with pay-later workflows,
  inventory management, and WebSocket-powered real-time order tracking. I built
  most of the application, owning the FastAPI backend, PostgreSQL data flow,
  WebSockets, Docker setup, and core product functionality. The frontend is
  currently viewable; the backend is offline.
